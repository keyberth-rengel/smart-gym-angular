<app-page-header title="Clientes" subtitle="Padrón de socios" />

<div class="registry-layout">
  <form class="card form-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h2 class="form-title">Registrar cliente</h2>

    <div>
      <label class="form-label" for="cl-name">Nombre completo</label>
      <input
        id="cl-name"
        class="form-control"
        type="text"
        autocomplete="off"
        placeholder="Ej. Ana Torres"
        formControlName="name"
        [class.is-invalid]="!!error('name')"
        [attr.aria-invalid]="!!error('name')"
        aria-describedby="cl-name-err"
      />
      <div
        id="cl-name-err"
        class="invalid-feedback d-block"
        [hidden]="!error('name')"
        data-testid="name-error"
      >
        {{ error('name') }}
      </div>
    </div>

    <div>
      <label class="form-label" for="cl-email">Correo electrónico</label>
      <input
        id="cl-email"
        class="form-control"
        type="text"
        inputmode="email"
        autocomplete="off"
        placeholder="nombre@correo.com"
        formControlName="email"
        [class.is-invalid]="!!error('email')"
        [attr.aria-invalid]="!!error('email')"
        aria-describedby="cl-email-err"
      />
      <div
        id="cl-email-err"
        class="invalid-feedback d-block"
        [hidden]="!error('email')"
        data-testid="email-error"
      >
        {{ error('email') }}
      </div>
    </div>

    <div class="row g-3">
      <div class="col-6">
        <label class="form-label" for="cl-age">Edad</label>
        <input
          id="cl-age"
          class="form-control"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Ej. 28"
          formControlName="age"
          [class.is-invalid]="!!error('age')"
          [attr.aria-invalid]="!!error('age')"
          aria-describedby="cl-age-err"
        />
        <div
          id="cl-age-err"
          class="invalid-feedback d-block"
          [hidden]="!error('age')"
          data-testid="age-error"
        >
          {{ error('age') }}
        </div>
      </div>
      <div class="col-6">
        <label class="form-label" for="cl-dni"
          >DNI <span class="text-body-secondary fw-normal">(opcional)</span></label
        >
        <input
          id="cl-dni"
          class="form-control"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="8 dígitos"
          formControlName="dni"
          [class.is-invalid]="!!error('dni')"
          [attr.aria-invalid]="!!error('dni')"
          aria-describedby="cl-dni-err"
        />
        <div
          id="cl-dni-err"
          class="invalid-feedback d-block"
          [hidden]="!error('dni')"
          data-testid="dni-error"
        >
          {{ error('dni') }}
        </div>
      </div>
    </div>

    <p class="form-note">Se crea el cliente y se vincula su DNI para que pueda identificarse.</p>

    <button
      type="submit"
      class="btn btn-primary w-100"
      [disabled]="submitting()"
      data-testid="submit"
    >
      @if (submitting()) {
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        <span>Registrando…</span>
      } @else {
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
        <span>Registrar cliente</span>
      }
    </button>
  </form>

  <app-registry-list
    title="Clientes"
    [columns]="columns"
    [rows]="rows()"
    [status]="status()"
    [forbidden]="forbidden()"
    errorTitle="No pudimos cargar los clientes"
    emptyTitle="Aún no hay clientes"
    emptyText="Registra al primero con el formulario."
    (retry)="load()"
  />
</div>
