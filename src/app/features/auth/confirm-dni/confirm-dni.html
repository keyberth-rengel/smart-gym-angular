<app-auth-layout>
  <form class="sg-auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <span class="sg-badge sg-badge-blue">Confirmación</span>
      <h1 class="mt-2 mb-1 display-6">Confirma tu DNI</h1>
      <p class="mb-0 text-body-secondary">
        Ingresa el DNI con el que vinculaste tu cuenta para consultar tu rutina, tu progreso y tu asistencia.
      </p>
    </div>

    <div>
      <label class="form-label" for="cd-dni">DNI</label>
      <input
        id="cd-dni"
        class="form-control"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="8 dígitos"
        formControlName="dni"
        [class.is-invalid]="!!error()"
        [attr.aria-invalid]="!!error()"
        aria-describedby="cd-dni-err"
      />
      <div id="cd-dni-err" class="invalid-feedback d-block" [hidden]="!error()" data-testid="dni-error">
        {{ error() }}
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()" data-testid="confirm-dni-submit">
      @if (submitting()) {
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        <span>Comprobando…</span>
      } @else {
        <i class="bi bi-check-lg" aria-hidden="true"></i>
        <span>Confirmar y entrar</span>
      }
    </button>
  </form>
</app-auth-layout>
