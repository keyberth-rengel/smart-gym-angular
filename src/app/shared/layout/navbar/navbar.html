<header class="navbar-bar">
  <div class="brand">
    <span class="sg-logo" aria-hidden="true"><i class="bi bi-lightning-charge-fill"></i></span>
    <span class="sg-brand">SMARTGYM</span>
    @if (badge(); as b) {
      <app-badge [tone]="b.tone" data-testid="navbar-role-badge">{{ b.text }}</app-badge>
    }
  </div>
  <div class="user">
    <div class="who">
      <span class="avatar" aria-hidden="true" data-testid="navbar-initials">{{ initials() }}</span>
      <div class="who-text">
        <div class="who-name" data-testid="navbar-name">{{ name() }}</div>
        <div class="who-sub" data-testid="navbar-sub">{{ subtitle() }}</div>
      </div>
    </div>
    <button type="button" class="signout" (click)="signOut()" data-testid="sign-out">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      <span class="signout-label">Salir</span>
    </button>
  </div>
</header>
